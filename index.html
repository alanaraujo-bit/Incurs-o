<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover habilita safe-areas; sem maximum-scale para não bloquear zoom por acessibilidade -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08090f" />
    <meta name="color-scheme" content="dark light" />

    <title>Incursão — sua rota até Avengers: Doomsday</title>
    <meta
      name="description"
      content="Companion de maratona: 30 filmes e séries em ordem curada, com o motivo de cada um, seu progresso salvo no aparelho e a contagem do quanto falta para você estar pronto para Avengers: Doomsday."
    />
    <link rel="canonical" href="https://incursao.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Incursão" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Incursão — sua rota até Avengers: Doomsday" />
    <meta
      property="og:description"
      content="30 produções em ordem curada, o motivo de cada uma e quanto falta para você estar preparado. Sem cadastro."
    />
    <meta property="og:image" content="/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Incursão — sua rota até Avengers: Doomsday" />
    <meta
      name="twitter:description"
      content="30 produções em ordem curada, o motivo de cada uma e quanto falta para você estar preparado."
    />
    <meta name="twitter:image" content="/social.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Incursão" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <script>
      // Aplica o tema antes da primeira pintura. Evita flash branco na abertura da PWA.
      (function () {
        try {
          var saved = localStorage.getItem('incursao.theme');
          var dark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              !window.matchMedia('(prefers-color-scheme: light)').matches);
          var t = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#08090f' : '#f4f1ea');
          if (!dark) document.getElementById('boot')?.classList.add('boot-light');
        } catch (e) {}
      })();
    </script>

    <style>
      /* Tela de inicialização: pintada antes do bundle, some quando o app monta. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-content: center;
        gap: 18px;
        justify-items: center;
        background: #08090f;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      #boot.boot-light {
        background: #f5f2ec;
      }
      #boot[hidden] {
        opacity: 0;
        visibility: hidden;
        display: grid;
        pointer-events: none;
      }
      #boot svg {
        width: 46px;
        height: 46px;
      }
      #boot .bar {
        width: 92px;
        height: 2px;
        background: rgba(227, 171, 79, 0.18);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        background: #e3ab4f;
        animation: bootslide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes bootslide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="#e3ab4f" stroke-width="2.2">
        <circle cx="19" cy="24" r="13" opacity="0.85" />
        <circle cx="29" cy="24" r="13" opacity="0.5" />
      </svg>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #f2f3f7">
        <h1>Incursão</h1>
        <p>Este aplicativo precisa de JavaScript para funcionar.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
