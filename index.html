<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover habilita safe-areas; sem maximum-scale para não bloquear zoom por acessibilidade -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08090f" />
    <meta name="color-scheme" content="dark light" />

    <title>Incursão — sua rota até Avengers: Doomsday</title>
    <meta
      name="description"
      content="Companion de maratona: 30 filmes e séries em ordem curada, com o motivo de cada um, seu progresso salvo no aparelho e a contagem do quanto falta para você estar pronto para Avengers: Doomsday."
    />
    <!-- %SITE_URL% é resolvido no build (ver siteUrlPlugin em vite.config.ts) -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:url" content="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Incursão" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Incursão — sua rota até Avengers: Doomsday" />
    <meta
      property="og:description"
      content="30 produções em ordem curada, o motivo de cada uma e quanto falta para você estar preparado. Sem cadastro."
    />
    <meta property="og:image" content="%SITE_URL%/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Incursão — sua rota até Avengers: Doomsday" />
    <meta
      name="twitter:description"
      content="30 produções em ordem curada, o motivo de cada uma e quanto falta para você estar preparado."
    />
    <meta name="twitter:image" content="%SITE_URL%/social.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Incursão" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <script>
      // Aplica o tema antes da primeira pintura. Evita flash branco na abertura da PWA.
      (function () {
        try {
          var saved = localStorage.getItem('incursao.theme');
          var dark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              !window.matchMedia('(prefers-color-scheme: light)').matches);
          var t = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#08090f' : '#f4f1ea');
          if (!dark) document.getElementById('boot')?.classList.add('boot-light');
        } catch (e) {}
      })();
    </script>

    <style>
      /* Tela de inicialização: pintada antes do bundle, some quando o app monta. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-content: center;
        gap: 18px;
        justify-items: center;
        background: #08090f;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      #boot.boot-light {
        background: #f5f2ec;
      }
      #boot[hidden] {
        opacity: 0;
        visibility: hidden;
        display: grid;
        pointer-events: none;
      }
      #boot svg {
        width: 46px;
        height: 46px;
      }
      #boot .bar {
        width: 92px;
        height: 2px;
        background: rgba(227, 171, 79, 0.18);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        background: #e3ab4f;
        animation: bootslide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes bootslide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i {
          animation: none;
          width: 100%;
        }
      }

      /* Estado de falha: substitui a barra quando o app não monta. */
      #boot-fail {
        display: none;
        max-width: 30rem;
        padding: 0 1.5rem;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
        color: #f2f3f7;
      }
      #boot.failed .bar {
        display: none;
      }
      #boot.failed #boot-fail {
        display: block;
      }
      #boot.boot-light #boot-fail {
        color: #16181d;
      }
      #boot-fail .t {
        margin: 0 0 0.5rem;
        font-size: 1.0625rem;
        font-weight: 650;
      }
      #boot-fail .d {
        margin: 0 0 1.25rem;
        font-size: 0.8125rem;
        line-height: 1.6;
        opacity: 0.72;
      }
      #boot-fail .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
      }
      #boot-fail button {
        min-height: 44px;
        padding: 0 1.125rem;
        border: 1px solid transparent;
        border-radius: 8px;
        background: #e3ab4f;
        color: #14100a;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 550;
        cursor: pointer;
      }
      #boot-fail button.ghost {
        background: transparent;
        border-color: currentColor;
        color: inherit;
        opacity: 0.66;
      }
      #boot-fail .e {
        margin: 1.25rem 0 0;
        font-family: ui-monospace, monospace;
        font-size: 0.6875rem;
        line-height: 1.5;
        opacity: 0.42;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="#e3ab4f" stroke-width="2.2">
        <circle cx="19" cy="24" r="13" opacity="0.85" />
        <circle cx="29" cy="24" r="13" opacity="0.5" />
      </svg>
      <div class="bar"><i></i></div>
      <div id="boot-fail">
        <p class="t">O aplicativo não conseguiu abrir</p>
        <p class="d">
          Isso costuma ser cache antigo guardado pelo navegador. Restaurar resolve e não apaga seu
          progresso.
        </p>
        <div class="actions">
          <button type="button" id="boot-repair">Restaurar aplicativo</button>
          <button type="button" id="boot-reload" class="ghost">Só recarregar</button>
        </div>
        <p class="e" id="boot-error"></p>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #f2f3f7">
        <h1>Incursão</h1>
        <p>Este aplicativo precisa de JavaScript para funcionar.</p>
      </div>
    </noscript>
    <script>
      /**
       * Rede de segurança da inicialização.
       *
       * A tela de boot só some quando o React monta. Sem isto, qualquer falha
       * — chunk que não chega, cache do service worker parcialmente descartado
       * pelo iOS, erro em tempo de execução — deixa o usuário preso numa barra
       * de carregamento animada, sem saída e sem informação.
       *
       * Aqui a falha vira estado visível e recuperável. O reparo remove
       * service workers e caches, mas NUNCA toca no localStorage: o progresso
       * da maratona sobrevive.
       */
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        var TIMEOUT_MS = 12000;
        var failed = false;
        var timer;

        function fail(reason) {
          if (failed || window.__incursaoBooted) return;
          failed = true;
          clearTimeout(timer);
          boot.classList.add('failed');
          boot.removeAttribute('aria-hidden');
          var slot = document.getElementById('boot-error');
          if (slot && reason) slot.textContent = String(reason).slice(0, 300);
        }

        timer = setTimeout(function () {
          fail('Tempo limite de inicialização (' + TIMEOUT_MS / 1000 + 's).');
        }, TIMEOUT_MS);

        window.addEventListener('error', function (event) {
          // Falha ao carregar script/estilo dispara error no elemento.
          var target = event.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            fail('Não foi possível carregar: ' + (target.src || target.href));
            return;
          }
          fail(event.message);
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var r = event.reason;
          fail((r && (r.message || r)) || 'Falha não tratada durante a inicialização.');
        });

        // Sinal emitido pelo React assim que a aplicação monta.
        window.addEventListener('incursao:ready', function () {
          clearTimeout(timer);
        });

        var reload = document.getElementById('boot-reload');
        if (reload) {
          reload.addEventListener('click', function () {
            location.reload();
          });
        }

        var repair = document.getElementById('boot-repair');
        if (repair) {
          repair.addEventListener('click', function () {
            repair.disabled = true;
            repair.textContent = 'Restaurando…';
            var jobs = [];
            if ('serviceWorker' in navigator) {
              jobs.push(
                navigator.serviceWorker
                  .getRegistrations()
                  .then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.unregister(); }));
                  })
                  .catch(function () {}),
              );
            }
            if (window.caches && caches.keys) {
              jobs.push(
                caches
                  .keys()
                  .then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  })
                  .catch(function () {}),
              );
            }
            Promise.all(jobs).then(function () {
              // Query nova evita que o HTML volte do cache do navegador.
              location.replace(location.pathname + '?restaurado=' + Date.now());
            });
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
